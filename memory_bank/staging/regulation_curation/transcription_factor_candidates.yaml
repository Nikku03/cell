# Phase R2a staged regulation candidates — transcription factors
#
# Status: MACHINE-ACQUIRED, AWAITING HUMAN REVIEW.
# Acquisition method: GenBank annotation parsing (CP016816.2 /product= keyword match against {transcriptional regulator, helix-turn-helix, MerR/LysR/TetR/AraC/Fur/Spx family, ...}; histidine kinase / sensor kinase / response regulator hits excluded — those are in two_component_candidates.yaml). Strict HTH/Pfam HMM path (PF00126 / PF00165 / PF01047 / PF13411 / PF03466) unavailable — see acquisition_log.md.
# Candidate count: 3
#
# Every entry below carries confidence: candidate. The Phase R2b
# review session promotes credible entries (with rewritten
# confidence: measured | inferred) to the production YAML at
# cell_sim/data/regulation_network_syn3a.yaml. Reject the rest.
#
# Provenance fields:
#   provenance_channel : how this candidate was acquired
#                        (genbank_annotation | pfam_hmm | rfam_cm)
#   protein_id         : GenBank /protein_id (always)
#   inference_xref     : GenBank /inference (RefSeq or SwissProt)
#   product_annotation : verbatim /product string
#   e_value            : null when not from an HMM/BLAST search
#
# Re-run via: python scripts/acquire_regulation_candidates.py
# ============================================================================
#
# Phase R2b annotation (2026-04-30): deferral_decision blocks have been
# appended in-place to JCVISYN3A_0042 and JCVISYN3A_0620. JCVISYN3A_0525
# (mraZ) was PROMOTED to the production YAML and is left without a
# deferral_decision block — see r2b_review_log.md for the audit trail.
# Re-running scripts/acquire_regulation_candidates.py will overwrite
# this file and the deferral blocks will be lost; reapply from
# r2b_review_log.md if that happens.
# ============================================================================

# Target gene prediction is NOT performed in Phase R2a (target_genes_predicted is always []). ChIP-seq data does not exist for Syn3A; comparative genomics inference is Phase R2b curation work.

candidates:
- candidate_id: 'JCVISYN3A_0042'
  tf_locus: 'JCVISYN3A_0042'
  gene_name: null
  matched_keyword: 'transcriptional regulator'
  product_annotation: 'Uncharacterized transcriptional regulator'
  protein_length_aa: 275
  genbank_accession: 'CP016816.2'
  protein_id: 'AVX54592.1'
  inference_xref: 'EXISTENCE: similar to AA sequence:RefSeq:WP_013729196.1'
  provenance_channel: 'genbank_annotation'
  predicted_class: 'unspecified'
  target_genes_predicted: []
  e_value: null
  confidence: 'candidate'
  deferral_decision:
    decision: defer
    reviewed_on: 2026-04-30
    reviewed_by: Naresh Chhillar
    rationale: |
      HTH motif is present in the protein architecture (predicted_class flagged the
      product as a transcriptional regulator), indicating structural compatibility
      with DNA-binding regulator function. However, the gene is annotated as
      "Uncharacterized transcriptional regulator" in the JCVI Syn3A annotation, and
      no target genes have been mapped through ChIP-seq, transcriptomics, or
      comparative genomics. Promoting this entry without target information would
      add a regulator with no defined regulatory effect — it could not contribute
      to simulator dynamics. Promotion is deferred until either (a) a future
      curation session maps candidate target genes via comparative genomics, or
      (b) experimental data from related organisms surfaces.
    next_review_trigger: target_gene_mapping_session

