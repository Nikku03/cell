# Mutation targets for M7-Evolve v2
#
# The Researcher LLM picks one target per round (weighted by `weight`).
# Each target defines what file the LLM can mutate, what hard constraints
# apply, and which objective dimensions it primarily affects.
#
# Different targets push different parts of the stack:
#   - initial_program.py  -> fine-tune accuracy
#   - knockout_sweep.py   -> inference speed
#   - gnn_v7_hybrid.py    -> architecture (affects accuracy + speed + memory)
#
# Constraints are FUNCTIONAL — if a mutation breaks them, snapshot_tests.py
# rejects it before the full benchmark runs.

targets:
  # ----------------------------------------------------------------
  - id: finetune
    path: experiments/m7/initial_program.py
    weight: 1.0
    primary_objective: accuracy
    description: |
      Fine-tune script with mutable hyperparameters (LR, bias_strength,
      target_category, weight_count/flux/cum) and the
      filter_weakness_by_category helper. Use this target to optimise
      val_singlestep_mse and val_rollout_200_mse.
    constraints:
      - "Must print metrics block between ===EVAL_METRICS=== markers"
      - "LEARNING_RATE must remain in [3e-5, 3e-4]"
      - "FINE_TUNE_STEPS must remain in [500, 5000]"
      - "Must complete within 12 minutes wall-clock"

  # ----------------------------------------------------------------
  - id: inference
    path: cell_sim/lgnn/analysis/knockout_sweep.py
    weight: 0.5
    primary_objective: speed
    description: |
      Knockout sweep inference loop. Mutate batching, eval_dtype,
      activation checkpointing, or add caching to reduce wall-time
      per knockout. PRIMARY GOAL: improve sweep_ko_per_sec without
      sacrificing impact-score accuracy.
    constraints:
      - "run_knockout_sweep signature must remain identical"
      - "Impact scores per locus must match baseline within ±5%"
      - "Output DataFrame schema must remain identical (locus_4d, locus_tag, impact_score, n_gene_rows_zeroed)"

  # ----------------------------------------------------------------
  - id: architecture
    path: cell_sim/lgnn/models/gnn_v7_hybrid.py
    weight: 0.3
    primary_objective: combined
    description: |
      Model architecture. Risky but high-payoff target. Mutations can
      adjust CfC tau_min, residual head structure, layer count,
      hidden dim, attention type. Architecture changes require
      re-training from scratch (which costs time), so prefer mutations
      compatible with loading existing M7.7 state_dict via strict=False.
    constraints:
      - "CellGNNv7Hybrid.forward signature must remain (x, x_var=None, ...) -> (x_next, v_log)"
      - "Must preserve PINN head + Δx = S·v invariant for SBML rows"
      - "Must remain loadable via torch.load with strict=False"
      - "Architecture changes that require full retrain need >30 min budget"

  # ----------------------------------------------------------------
  - id: training_loop
    path: cell_sim/lgnn/training/train_m7.py
    weight: 0.4
    primary_objective: accuracy
    description: |
      Training script. Mutate loss function, optimizer, scheduler,
      curriculum logic, scheduled sampling parameters, or add new
      regularization terms. Same retrain caveat as architecture target.
    constraints:
      - "M7TrainConfig dataclass fields can be added but not removed"
      - "train_m7() function signature must remain compatible"
      - "Don't break the existing standard / random_anchor modes"

# Objective weights for composite scoring (matching full_benchmark.py).
# These are read by full_benchmark.py via env vars; setting per-experiment
# weights here lets you ship different evolve runs targeting different goals.
objectives:
  accuracy: 1.0     # composite val MSE ratio
  speed:    0.3     # sweep_time_sec ratio
  memory:   0.1     # peak_memory_gb ratio
