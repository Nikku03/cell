# Syn3A Regulation Network Configuration
#
# Status: SCHEMA ONLY. No regulatory entries are populated.
#
# Phase R1 (current): infrastructure-only. The four lists below are
# intentionally empty. The loader at
# cell_sim/layer4_regulation/network_loader.py treats this state as
# valid and the simulator runs with regulation disabled. The v15 and
# v16 essentiality MCC measurements do NOT depend on this file.
#
# Phase R2 (future, separate session): biological curation. Each entry
# added below requires the three provenance fields documented under
# "Per-entry provenance" and at least the kinetic keys documented in
# the per-section schema. The loader rejects partial entries.
#
# Curation source — TBD. Candidate sources for a future curation pass:
#   * Mycoplasma RegulonDB equivalent — no comprehensive resource
#     currently exists for Mycoplasma / JCVI-Syn3A.
#   * Lluch-Senar et al. 2015 (M. pneumoniae transcriptomics +
#     essentiality) — closest analog; many regulatory inferences in
#     supplementary tables.
#   * JCVI synthesis papers (Hutchison 2016, Pelletier 2021) for
#     architectural notes on what regulation Syn3A retained.
#   * Sigma factor identification by sequence homology against
#     B. subtilis SigA / SigH or M. genitalium homologs (BLAST + Pfam).
#   * Riboswitch identification by Infernal scans against Rfam.
#
# Per-entry provenance (REQUIRED for every populated entry)
# ---------------------------------------------------------
#   source       : free-form string identifying the paper, database
#                  accession, or curation note that justifies the
#                  kinetic parameters for this entry.
#   confidence   : one of {measured, inferred, placeholder}.
#                  - measured: rate constants come directly from a
#                    published in vitro / in vivo measurement on
#                    Syn3A or a close homolog.
#                  - inferred: rate constants extrapolated from a
#                    related organism (e.g. M. pneumoniae) without
#                    direct Syn3A data.
#                  - placeholder: rate constants are synthetic / order-
#                    of-magnitude. NOT acceptable in production.
#   curated_on   : ISO date the entry was added (YYYY-MM-DD).
#
# Until each entry has these three fields, the loader will reject it
# with a RegulationConfigError. Do not work around the check by
# inventing values; if the data is not curated, leave the entry out.
#
# Per-section schema
# ------------------
# transcription_factors:
#   - tf_locus: JCVISYN3A_XXXX
#     target_genes: [JCVISYN3A_YYYY, JCVISYN3A_ZZZZ]
#     k_bind:   <1/s>      # forward rate prefactor
#     k_unbind: <1/s>      # reverse rate
#     polarity: activator | repressor   # Phase R2 — not enforced in R1
#     source:       <provenance>
#     confidence:   <measured|inferred|placeholder>
#     curated_on:   YYYY-MM-DD
#
# sigma_factors:
#   - sigma_locus: JCVISYN3A_XXXX
#     gene_class:  housekeeping | stress | sporulation | <other>
#     competition_factor: <[0, 1]>
#     initial_free_count: <int>
#     source:       <provenance>
#     confidence:   <measured|inferred|placeholder>
#     curated_on:   YYYY-MM-DD
#
# riboswitches:
#   - gene_locus:        JCVISYN3A_XXXX
#     ligand_metabolite: M_xxx_c                # SBML id
#     k_fold:   <1/s>
#     k_unfold: <1/s>
#     initial_folded_fraction: <[0, 1]>
#     source:       <provenance>
#     confidence:   <measured|inferred|placeholder>
#     curated_on:   YYYY-MM-DD
#
# two_component_systems:
#   - sensor_locus:               JCVISYN3A_XXXX
#     response_regulator_locus:   JCVISYN3A_YYYY
#     k_phos:   <1/s>
#     k_dephos: <1/s>
#     initial_phos_state: 0 | 1
#     source:       <provenance>
#     confidence:   <measured|inferred|placeholder>
#     curated_on:   YYYY-MM-DD
#
# ============================================================================

transcription_factors:
  - tf_locus: JCVISYN3A_0525
    target_genes: []
    pfam_family: PF02381
    annotation_source: 'JCVI Syn3A GenBank annotation (CP016816.2) — gene named "mraZ"'
    homology_source: 'SwissProt MraZ family — characterized in E. coli and B. subtilis as a regulator of the dcw (division and cell wall) gene cluster'
    source: 'JCVI Syn3A GenBank annotation CP016816.2 (gene mraZ, /protein_id=AVX54841.1, /inference RefSeq SwissProt Q6MT21.1) + SwissProt MraZ family characterization in E. coli / B. subtilis as dcw cluster regulator'
    confidence: inferred
    curated_on: 2026-04-30
    curated_by: Naresh Chhillar
    notes: |
      Functional inference is from sequence homology and gene-name conservation. In
      reference organisms, MraZ regulates the dcw cluster (FtsZ, FtsA, FtsW, MurC-G,
      etc.). Whether MraZ regulates the analogous genes in Syn3A is not directly
      established. Target gene list is intentionally empty — comparative-genomics
      target inference is deferred to a future session.
    parameters_status: not_specified

sigma_factors:
  - sigma_locus: JCVISYN3A_0407
    gene_class: housekeeping
    pfam_family: PF00140
    annotation_source: 'JCVI Syn3A GenBank annotation (CP016816.2) — gene named "rpoD"'
    homology_source: 'SwissProt sigma-70 family'
    source: 'JCVI Syn3A GenBank annotation CP016816.2 (gene rpoD, /protein_id=AVX54771.1, /inference RefSeq WP_013447807.1) + SwissProt sigma-70 family homology'
    confidence: inferred
    curated_on: 2026-04-30
    curated_by: Naresh Chhillar
    notes: |
      Single canonical sigma factor in Syn3A's minimal genome. Functional inference is
      from sequence homology to characterized sigma-70 family members; direct ChIP-seq
      or biochemical characterization in Syn3A has not been performed. The "housekeeping"
      gene_class assignment reflects the absence of alternative sigma factors in Syn3A
      and the universal role of sigma-70 in housekeeping transcription across bacteria.
    parameters_status: not_specified

riboswitches: []

two_component_systems: []
