<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>E. coli — Cell Map</title>
<style>
*{box-sizing:border-box} html,body{margin:0;height:100%;background:#060912;color:#e2e8f0;font-family:system-ui,Segoe UI,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;width:100vw;height:100vh;cursor:grab} #stage:active{cursor:grabbing}
.hud{position:fixed;z-index:10}
#left{top:0;left:0;width:300px;height:100%;background:rgba(9,14,26,.92);border-right:1px solid #1e293b;padding:12px;overflow:auto}
#left h1{font-size:16px;margin:0 0 8px;background:linear-gradient(90deg,#38bdf8,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
input,select{width:100%;background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:6px;padding:7px;font-size:13px;margin-bottom:8px}
.glist{max-height:230px;overflow:auto;border:1px solid #1e293b;border-radius:6px}
.gi{padding:4px 8px;font-size:12px;cursor:pointer;display:flex;gap:6px;align-items:center} .gi:hover{background:#16203a}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid #16203a}
.chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;margin:2px;cursor:pointer;border:1px solid #334155}
#tip{position:fixed;z-index:20;pointer-events:none;background:rgba(2,6,18,.96);border:1px solid #334155;border-radius:8px;padding:8px 10px;font-size:12px;max-width:240px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#legend{bottom:10px;right:12px;background:rgba(9,14,26,.9);border:1px solid #1e293b;border-radius:8px;padding:8px 10px;font-size:11px}
.lg{display:flex;align-items:center;gap:6px;margin:2px 0}
#hint{top:8px;left:312px;font-size:11px;color:#64748b}
text{pointer-events:none;font-family:system-ui}
.muted{color:#64748b;font-size:11px}
button{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer}
</style></head><body>
<svg id="stage"><g id="world"></g></svg>
<div id="tip" class="hud"></div>
<div id="hint" class="hud">scroll = zoom · drag = pan · click a gene to grow its network</div>
<div id="left" class="hud">
  <h1>🧫 E. coli — Cell Map</h1>
  <input id="search" placeholder="search gene…" oninput="renderList()">
  <div class="glist" id="glist"></div>
  <div id="detail" class="muted" style="margin-top:10px">click a gene tick on the chromosome, or search.</div>
  <button onclick="resetView()" style="margin-top:8px">reset view</button>
</div>
<div id="legend" class="hud">
  <div class="lg"><span class="dot" style="background:#ef4444"></span>essential (high P)</div>
  <div class="lg"><span class="dot" style="background:#22c55e"></span>non-essential</div>
  <div class="lg"><span class="dot" style="background:#c084fc"></span>transcription factor</div>
  <div class="lg"><span class="dot" style="background:#38bdf8"></span>metabolic</div>
  <div class="lg"><span style="width:16px;height:2px;background:#34d399;display:inline-block"></span>activates →</div>
  <div class="lg"><span style="width:16px;height:2px;background:#f87171;display:inline-block"></span>represses ⊣</div>
  <div class="lg"><span style="width:16px;height:2px;background:#64748b;display:inline-block"></span>shares pathway</div>
</div>
<script>
const DATA=__DATA__;
const byName={}; DATA.genes.forEach(g=>byName[g.name]=g);
// reverse regulatory map (who regulates each gene)
const regOf={}; for(const tf in DATA.net){for(const [t,s] of DATA.net[tf]){(regOf[t]=regOf[t]||[]).push([tf,s]);}}
const W=window.innerWidth,H=window.innerHeight, cx=W/2+120, cy=H/2, R=Math.min(W,H)*0.36;
const world=document.getElementById('world'), tip=document.getElementById('tip');
document.getElementById('stage').setAttribute('viewBox','0 0 '+W+' '+H);
let view={x:0,y:0,k:1};
function applyView(){world.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);}
function essColor(g){const p=g.pred_prob||0;return p>=.5?'#ef4444':p>=.3?'#fbbf24':'#22c55e';}
function typeColor(g){return g.is_tf?'#c084fc':g.metabolic?'#38bdf8':essColor(g);}
const NS='http://www.w3.org/2000/svg';
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
// static: membrane + compartments + chromosome ring
function drawStatic(){
  world.appendChild(el('ellipse',{cx,cy,rx:R*1.5,ry:R*1.18,fill:'#0a1424',stroke:'#1e3a5f','stroke-width':6,opacity:.9}));
  world.appendChild(el('ellipse',{cx,cy,rx:R*1.5,ry:R*1.18,fill:'none',stroke:'#38bdf8','stroke-width':2,opacity:.25}));
  const comps=[['nucleoid',cx-R*0.55,cy,'#3b1d5e','TFs / DNA'],['ribosome',cx,cy-R*0.7,'#3a2d12','core'],['metabolism',cx+R*0.55,cy+R*0.1,'#0e2a3a','metabolism']];
  comps.forEach(([n,x,y,c,lab])=>{world.appendChild(el('circle',{cx:x,cy:y,r:R*0.42,fill:c,opacity:.18}));
    const t=el('text',{x,y:y-R*0.42-6,fill:'#64748b','font-size':13,'text-anchor':'middle'});t.textContent=lab;world.appendChild(t);});
  // chromosome ring of gene ticks
  const ring=el('g',{}); world.appendChild(ring);
  ring.appendChild(el('circle',{cx,cy,r:R,fill:'none',stroke:'#1e293b','stroke-width':1}));
  DATA.genes.forEach(g=>{ if(g.pos===null) return; const a=g.pos*2*Math.PI-Math.PI/2;
    const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+(R+7)*Math.cos(a),y2=cy+(R+7)*Math.sin(a);
    const ln=el('line',{x1,y1,x2,y2,stroke:essColor(g),'stroke-width':1.4,'data-g':g.name,class:'tick'});
    ring.appendChild(ln);});
}
let dyn=null;
function clearDyn(){if(dyn)dyn.remove();dyn=el('g',{});world.appendChild(dyn);}
function place(name,x,y,r,col,lbl){
  const c=el('circle',{cx:x,cy:y,r,fill:col,stroke:'#0b1220','stroke-width':1.5,'data-g':name,class:'pdot',style:'cursor:pointer'});
  dyn.appendChild(c);
  if(lbl){const t=el('text',{x,y:y-r-3,fill:'#cbd5e1','font-size':10,'text-anchor':'middle'});t.textContent=name;dyn.appendChild(t);}
  return [x,y];
}
function pipe(x1,y1,x2,y2,col,arrow){
  const mx=(x1+x2)/2,my=(y1+y2)/2-30;
  dyn.appendChild(el('path',{d:`M${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}`,fill:'none',stroke:col,'stroke-width':1.6,opacity:.7,'marker-end':arrow?'url(#arr)':''}));
}
function expand(name){
  const g=byName[name]; if(!g)return; clearDyn();
  // gene -> product branch from chromosome tick
  if(g.pos!==null){const a=g.pos*2*Math.PI-Math.PI/2,tx=cx+R*Math.cos(a),ty=cy+R*Math.sin(a);
    pipe(tx,ty,cx,cy,'#475569',false);}
  place(name,cx,cy,11,typeColor(g),name);
  // targets (out): arc on the right
  const tg=(DATA.net[name]||[]).slice(0,26);
  tg.forEach((t,i)=>{const ang=-0.9+1.8*(i/(Math.max(tg.length-1,1)));const x=cx+260*Math.cos(ang),y=cy+260*Math.sin(ang);
    const gg=byName[t[0]]; pipe(cx,cy,x,y,t[1]===1?'#34d399':t[1]===-1?'#f87171':'#64748b',true); place(t[0],x,y,5,gg?typeColor(gg):'#475569', tg.length<=14?t[0]:'');});
  // regulators (in): arc on the left
  const rin=(regOf[name]||[]).slice(0,14);
  rin.forEach((t,i)=>{const ang=Math.PI-0.8+1.6*(i/(Math.max(rin.length-1,1)));const x=cx+220*Math.cos(ang),y=cy+220*Math.sin(ang);
    const gg=byName[t[0]]; pipe(x,y,cx,cy,t[1]===1?'#34d399':t[1]===-1?'#f87171':'#64748b',true); place(t[0],x,y,5,gg?typeColor(gg):'#475569', rin.length<=10?t[0]:'');});
  // metabolic pathway neighbours: below
  const mn=(DATA.metab_adj[name]||[]).slice(0,10);
  mn.forEach((t,i)=>{const x=cx-160+(320*i/Math.max(mn.length-1,1)),y=cy+230;
    const gg=byName[t]; pipe(cx,cy,x,y,'#64748b',false); place(t,x,y,5,gg?typeColor(gg):'#475569',t);});
  detail(g);
}
function detail(g){
  const reg=(regOf[g.name]||[]).map(x=>x[0]); const tg=(DATA.net[g.name]||[]).map(x=>x[0]);
  document.getElementById('detail').innerHTML=`<div style="font-size:17px;font-weight:700">${g.name} <span class="muted">${g.b||''}</span></div>
   <div class="row"><span>P(essential)</span><b style="color:${essColor(g)}">${g.pred_prob??'–'}</b></div>
   <div class="row"><span>essential (Keio)</span><b>${g.essential===1?'YES':g.essential===0?'no':'?'}</b></div>
   <div class="row"><span>compartment</span><b>${g.comp}</b></div>
   <div class="row"><span>metabolic</span><b>${g.metabolic?'yes':'no'}</b></div>
   <div class="row"><span>TF</span><b>${g.is_tf?g.tf_class+' (regulon '+g.regulon+')':'no'}</b></div>
   ${tg.length?`<div style="margin-top:6px"><b>→ regulates (${tg.length})</b><div>${tg.slice(0,20).map(n=>`<span class="chip" onclick="expand('${n}')">${n}</span>`).join('')}</div></div>`:''}
   ${reg.length?`<div style="margin-top:6px"><b>← regulated by (${reg.length})</b><div>${reg.slice(0,16).map(n=>`<span class="chip" onclick="expand('${n}')">${n}</span>`).join('')}</div></div>`:''}
   ${(DATA.metab_adj[g.name]||[]).length?`<div style="margin-top:6px"><b>pathway neighbours</b><div>${DATA.metab_adj[g.name].map(n=>`<span class="chip" onclick="expand('${n}')">${n}</span>`).join('')}</div></div>`:''}`;
}
function renderList(){const q=(document.getElementById('search').value||'').toLowerCase();
  const arr=DATA.genes.filter(g=>!q||g.name.includes(q)).slice(0,200);
  document.getElementById('glist').innerHTML=arr.map(g=>`<div class="gi" onclick="expand('${g.name}')"><span class="dot" style="background:${typeColor(g)}"></span>${g.name} <span class="muted">${g.is_tf?'TF':g.metabolic?'met':''}</span></div>`).join('');}
// tooltip + click via delegation
document.getElementById('stage').addEventListener('mousemove',e=>{
  const t=e.target; if(t&&t.getAttribute&&t.getAttribute('data-g')){const g=byName[t.getAttribute('data-g')];
    if(g){tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';
      tip.innerHTML=`<b>${g.name}</b> <span class="muted">${g.b||''}</span><br>P(ess) <b style="color:${essColor(g)}">${g.pred_prob??'–'}</b> · ${g.comp}<br>${g.is_tf?'TF·'+g.tf_class+' (reg '+g.regulon+')':g.metabolic?'metabolic enzyme':'protein'}<br><span class="muted">click to expand its network</span>`;}}
  else tip.style.display='none';});
document.getElementById('stage').addEventListener('click',e=>{const t=e.target;if(t&&t.getAttribute&&t.getAttribute('data-g'))expand(t.getAttribute('data-g'));});
// zoom + pan
const stage=document.getElementById('stage');
stage.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:1/1.12;const mx=e.clientX,my=e.clientY;
  view.x=mx-(mx-view.x)*f;view.y=my-(my-view.y)*f;view.k*=f;applyView();},{passive:false});
let drag=null;
stage.addEventListener('mousedown',e=>{if(e.target.getAttribute&&e.target.getAttribute('data-g'))return;drag={x:e.clientX-view.x,y:e.clientY-view.y};});
window.addEventListener('mousemove',e=>{if(drag){view.x=e.clientX-drag.x;view.y=e.clientY-drag.y;applyView();}});
window.addEventListener('mouseup',()=>drag=null);
function resetView(){view={x:0,y:0,k:1};applyView();}
// arrow marker
const defs=el('defs',{});const mk=el('marker',{id:'arr',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});
mk.appendChild(el('path',{d:'M0 0 L10 5 L0 10 z',fill:'#94a3b8'}));defs.appendChild(mk);
document.getElementById('stage').appendChild(defs);
drawStatic(); renderList(); clearDyn();
// open with a nice example
expand('crp');
</script></body></html>
